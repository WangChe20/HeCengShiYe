<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 何曾拾叶</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg-deep: #050818;
      --star-warm: #ffe9a8;
      --star-bright: #fff8e7;
      --text-primary: #f5f0e6;
      --text-muted: rgba(245, 240, 230, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "KaiTi", "STKaiti", "FangSong", "SimSun", cursive, serif;
      color: var(--text-primary);
      background: var(--bg-deep);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(30, 45, 90, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% 100%, rgba(20, 30, 70, 0.6) 0%, transparent 60%),
        linear-gradient(180deg, #080c1f 0%, #0a1028 40%, #050818 100%);
    }

    .site-header {
      position: fixed;
      bottom: 1.1rem;
      left: 1.1rem;
      z-index: 10;
      text-align: left;
      pointer-events: none;
    }

    .site-title {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      font-weight: normal;
      letter-spacing: 0.12em;
      color: var(--star-bright);
      text-shadow: 0 0 20px rgba(255, 230, 160, 0.35);
    }

    .main-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 层 1：远景星点 + 流星 */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 层 2：中央银河星云（Canvas） */
    #galaxy-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 层 3：四角星（浮动在银河前方） */
    #stars-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
    }

    .fab-column {
      position: fixed;
      right: clamp(1.2rem, 4vw, 2rem);
      bottom: clamp(3.5rem, 8vh, 4.5rem);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    .add-btn,
    .cal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(44px, 10vw, 52px);
      height: clamp(44px, 10vw, 52px);
      border: 1px solid rgba(255, 230, 160, 0.35);
      border-radius: 50%;
      background: rgba(255, 230, 160, 0.08);
      color: var(--star-warm);
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .add-btn {
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      line-height: 1;
    }

    .add-btn:hover,
    .cal-btn:hover {
      background: rgba(255, 230, 160, 0.15);
      box-shadow: 0 0 20px rgba(255, 220, 150, 0.2);
    }

    /* ---------- 回忆记录模态框 ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(3, 5, 15, 0.55);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      position: relative;
      width: min(92vw, 420px);
      max-height: 82vh;
      overflow-y: auto;
      padding: 2rem 1.5rem 1.5rem;
      border: 1px solid rgba(255, 230, 160, 0.25);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(20, 28, 60, 0.92), rgba(8, 12, 30, 0.95));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 220, 150, 0.08);
      transform: translateY(14px) scale(0.97);
      transition: transform 0.35s ease;
    }

    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 0.5rem;
      right: 0.75rem;
      width: 2.2rem;
      height: 2.2rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.7rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.3s;
    }

    .modal-close:hover {
      color: var(--star-bright);
    }

    .memory-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }

    .memory-text {
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      line-height: 1.8;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .memory-media {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .memory-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px dashed rgba(255, 230, 160, 0.35);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      background: rgba(255, 230, 160, 0.03);
      overflow: hidden;
    }

    .memory-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .memory-image.has-image {
      aspect-ratio: auto;
      border: none;
      padding: 0;
      background: none;
    }

    /* ---------- 添加回忆表单 ---------- */
    .form-card {
      padding: 1.75rem 1.5rem 1.5rem;
    }

    .form-title {
      font-size: 1.2rem;
      font-weight: normal;
      letter-spacing: 0.12em;
      color: var(--star-bright);
      margin-bottom: 1.25rem;
    }

    .form-field {
      display: block;
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid rgba(255, 230, 160, 0.25);
      border-radius: 10px;
      background: rgba(255, 230, 160, 0.06);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }

    .form-input::placeholder {
      color: rgba(245, 240, 230, 0.35);
    }

    .form-input:focus {
      border-color: rgba(255, 230, 160, 0.55);
      background: rgba(255, 230, 160, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 6rem;
      line-height: 1.6;
    }

    .date-inputs {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .date-input {
      text-align: center;
      padding-left: 0.4rem;
      padding-right: 0.4rem;
    }

    .date-input-year {
      width: 5.2rem;
    }

    .date-input-month,
    .date-input-day {
      width: 3rem;
    }

    .date-sep {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .upload-btn {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px dashed rgba(255, 230, 160, 0.35);
      border-radius: 10px;
      background: rgba(255, 230, 160, 0.04);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .upload-btn:hover {
      background: rgba(255, 230, 160, 0.1);
      color: var(--star-warm);
    }

    .file-name {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: var(--star-warm);
      letter-spacing: 0.03em;
      word-break: break-all;
    }

    .image-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .image-thumbs:empty {
      display: none;
    }

    .image-thumb {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 230, 160, 0.25);
      background: rgba(0, 0, 0, 0.2);
    }

    .image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-thumb-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
      transition: background 0.25s;
    }

    .image-thumb-remove:hover {
      background: rgba(214, 69, 69, 0.9);
    }

    .form-error {
      min-height: 1.2em;
      margin: 0.25rem 0 0.5rem;
      font-size: 0.85rem;
      color: #ff9f8a;
      letter-spacing: 0.05em;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .form-btn {
      padding: 0.55rem 1.4rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .form-btn-cancel {
      border: 1px solid rgba(255, 230, 160, 0.25);
      background: transparent;
      color: var(--text-muted);
    }

    .form-btn-cancel:hover {
      color: var(--text-primary);
      border-color: rgba(255, 230, 160, 0.5);
    }

    .form-btn-save {
      border: 1px solid rgba(255, 230, 160, 0.4);
      background: rgba(255, 230, 160, 0.12);
      color: var(--star-bright);
    }

    .form-btn-save:hover {
      background: rgba(255, 230, 160, 0.22);
    }

    /* ---------- 图片全屏预览 Lightbox ---------- */
    .image-preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.82);
      cursor: zoom-out;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .image-preview-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .image-preview-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6);
    }

    /* ---------- 按日期查找的日历弹窗 ---------- */
    .calendar-card {
      width: min(94vw, 380px);
    }

    .calendar-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }

    .calendar-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      color: var(--star-bright);
      letter-spacing: 0.05em;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 230, 160, 0.08);
      color: var(--star-warm);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.3s;
    }

    .calendar-nav:hover {
      background: rgba(255, 230, 160, 0.18);
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 0.35rem;
    }

    .calendar-weekdays span {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 0.3rem 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.2rem;
    }

    .calendar-day {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: rgba(245, 240, 230, 0.3);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: default;
    }

    .calendar-day.blank {
      visibility: hidden;
    }

    .calendar-day.has-memory {
      color: var(--star-bright);
      background: rgba(255, 200, 110, 0.2);
      border-color: rgba(255, 200, 110, 0.5);
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .calendar-day.has-memory:hover {
      background: rgba(255, 210, 120, 0.35);
      box-shadow: 0 0 12px rgba(255, 210, 140, 0.35);
    }

    .calendar-day.selected {
      box-shadow: inset 0 0 0 2px var(--star-warm);
    }

    .calendar-day.today {
      border-color: rgba(255, 230, 160, 0.4);
    }

    .calendar-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid rgba(255, 230, 160, 0.18);
      border-radius: 10px;
      background: rgba(255, 230, 160, 0.05);
      color: var(--text-primary);
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      cursor: pointer;
      transition: background 0.3s;
    }

    .calendar-item:hover {
      background: rgba(255, 230, 160, 0.12);
    }

    .date-list-card {
      width: min(92vw, 360px);
    }

    .date-list {
      margin-top: 0.9rem;
    }

    /* 弹窗层级：日历 < 选择列表 < 回忆/添加 < 图片全屏(200) */
    #calendar-modal { z-index: 100; }
    #date-list-modal { z-index: 110; }
    #memory-modal { z-index: 120; }
    #add-modal { z-index: 120; }
  </style>
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">✨ 何曾拾叶</h1>
  </header>

  <main class="main-stage">
    <canvas id="bg-canvas"></canvas>
    <canvas id="galaxy-canvas"></canvas>
    <canvas id="stars-canvas"></canvas>
  </main>

  <div class="fab-column">
    <button class="cal-btn" type="button" aria-label="按日期查找回忆">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2.5"></rect>
        <line x1="8" y1="3" x2="8" y2="7"></line>
        <line x1="16" y1="3" x2="16" y2="7"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </button>
    <button class="add-btn" type="button" aria-label="添加回忆">+</button>
  </div>

  <!-- 回忆记录弹窗 -->
  <div class="modal-overlay" id="memory-modal" role="dialog" aria-modal="true" aria-labelledby="memory-text">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
      <p class="memory-date" id="memory-date"></p>
      <p class="memory-text" id="memory-text"></p>
      <div class="memory-media">
        <div class="memory-image" id="memory-image">🖼 图片占位</div>
      </div>
    </div>
  </div>

  <!-- 添加回忆表单弹窗 -->
  <div class="modal-overlay" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="modal-card form-card">
      <button class="modal-close" id="add-close" type="button" aria-label="关闭">×</button>
      <h2 class="form-title" id="add-title">添加回忆</h2>

      <div class="form-field">
        <span class="form-label">日期</span>
        <div class="date-inputs">
          <input class="form-input date-input" id="add-date-year" type="text" inputmode="numeric" maxlength="4" placeholder="2025" aria-label="年">
          <span class="date-sep">年</span>
          <input class="form-input date-input" id="add-date-month" type="text" inputmode="numeric" maxlength="2" placeholder="5" aria-label="月">
          <span class="date-sep">月</span>
          <input class="form-input date-input" id="add-date-day" type="text" inputmode="numeric" maxlength="2" placeholder="21" aria-label="日">
          <span class="date-sep">日</span>
        </div>
      </div>

      <label class="form-field">
        <span class="form-label">文字内容</span>
        <textarea class="form-input form-textarea" id="add-text" rows="4" placeholder="写下这段回忆……"></textarea>
      </label>

      <div class="form-field">
        <span class="form-label">图片</span>
        <button class="upload-btn" id="add-image-btn" type="button">上传图片</button>
        <input type="file" id="add-image-input" accept="image/*" multiple hidden>
        <span class="file-name" id="image-file-name"></span>
        <div class="image-thumbs" id="image-thumbs"></div>
      </div>

      <p class="form-error" id="add-error" role="alert"></p>

      <div class="form-actions">
        <button class="form-btn form-btn-cancel" id="add-cancel" type="button">取消</button>
        <button class="form-btn form-btn-save" id="add-save" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 按日期查找回忆的日历弹窗 -->
  <div class="modal-overlay" id="calendar-modal" role="dialog" aria-modal="true" aria-labelledby="calendar-title">
    <div class="modal-card calendar-card">
      <button class="modal-close" id="calendar-close" type="button" aria-label="关闭">×</button>
      <div class="calendar">
        <div class="calendar-head">
          <button class="calendar-nav" id="cal-prev-year" type="button" aria-label="上一年">《</button>
          <button class="calendar-nav" id="cal-prev" type="button" aria-label="上个月">‹</button>
          <div class="calendar-title" id="calendar-title">2025年5月</div>
          <button class="calendar-nav" id="cal-next" type="button" aria-label="下个月">›</button>
          <button class="calendar-nav" id="cal-next-year" type="button" aria-label="下一年">》</button>
        </div>
        <div class="calendar-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>
  </div>

  <!-- 某一天有多条回忆时的选择弹窗 -->
  <div class="modal-overlay" id="date-list-modal" role="dialog" aria-modal="true" aria-labelledby="date-list-title">
    <div class="modal-card date-list-card">
      <button class="modal-close" id="date-list-close" type="button" aria-label="关闭">×</button>
      <h2 class="form-title" id="date-list-title">这一天的回忆</h2>
      <div class="date-list" id="date-list"></div>
    </div>
  </div>

  <!-- 图片全屏预览遮罩 -->
  <div class="image-preview-overlay" id="image-preview-overlay">
    <img id="image-preview-img" alt="图片预览">
  </div>

  <script>
    /* ============================================================
     * 星空系统
     * 层 1 — 远景星点 + 流星
     * 层 2 — 中央银河星云（Canvas，可扩展动画接口）
     * 层 3 — 四角星（数量 = 记录数，一对一绑定 + 自由漂移）
     * ============================================================ */

    const STAR_MARGIN = 40; // 星星距屏幕边缘的最小距离（漂移折返用）

    // ---------- 全局状态 ----------
    let bgCanvas, galaxyCanvas, starsCanvas;
    let bgCtx, galaxyCtx, starsCtx;
    let viewWidth = 0;
    let viewHeight = 0;
    let bgBuffer = null;
    let allStars = [];
    let meteors = [];
    let meteorCooldown = 2.5;
    let animFrameId = null;
    let lastTimestamp = 0;

    // ---------- 银河模块（预留后续「星星飞回中心」等动画接口） ----------
    const Galaxy = {
      particles: [],
      cx: 0,
      cy: 0,
      radiusX: 0,
      radiusY: 0,
      rotation: 0,

      /** 根据屏幕尺寸重建银河粒子 */
      rebuild: function (w, h) {
        this.particles = [];
        this.cx = w / 2;
        this.cy = h / 2;
        // 宽约 40%-50%，手机端随屏幕缩小
        this.radiusX = w * (w < 480 ? 0.36 : 0.44);
        this.radiusY = this.radiusX * 0.62;

        const rand = createRng(777);
        const count = w < 480 ? 900 : 1400;
        const arms = 2;

        for (let i = 0; i < count; i++) {
          const t = Math.pow(rand(), 0.55);
          const radius = t * 1.05;
          const arm = Math.floor(rand() * arms);
          const armAngle = (arm / arms) * Math.PI * 2;
          const spiralAngle = Math.log(radius * 8 + 1) * 2.8;
          const scatter = (rand() - 0.5) * 0.35 * (1 - t * 0.5);
          const angle = armAngle + spiralAngle + scatter;

          this.particles.push({
            nx: Math.cos(angle) * radius,
            ny: Math.sin(angle) * radius * 0.88,
            size: rand() * 1.6 + 0.25,
            dist: t,
            twinklePhase: rand() * Math.PI * 2,
            twinkleSpeed: rand() * 0.5 + 0.2,
          });
        }
      },

      /** 每帧绘制银河（缓慢旋转 + 呼吸感） */
      draw: function (ctx, time) {
        const breathe = 1 + 0.025 * Math.sin(time * 0.35);
        const alphaPulse = 0.92 + 0.08 * Math.sin(time * 0.28 + 1.2);
        this.rotation = time * 0.012;

        ctx.clearRect(0, 0, viewWidth, viewHeight);
        ctx.save();
        ctx.translate(this.cx, this.cy);
        ctx.rotate(this.rotation);
        ctx.scale(breathe, breathe);

        // 底层柔和光晕（椭圆星云基底）
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radiusX * 1.1);
        glow.addColorStop(0, "rgba(255, 242, 210, " + (0.14 * alphaPulse) + ")");
        glow.addColorStop(0.25, "rgba(255, 220, 170, " + (0.07 * alphaPulse) + ")");
        glow.addColorStop(0.5, "rgba(200, 180, 240, " + (0.035 * alphaPulse) + ")");
        glow.addColorStop(0.75, "rgba(140, 160, 220, " + (0.015 * alphaPulse) + ")");
        glow.addColorStop(1, "rgba(5, 8, 24, 0)");
        ctx.save();
        ctx.scale(1, this.radiusY / this.radiusX);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, this.radiusX * 1.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 螺旋光点
        for (let i = 0; i < this.particles.length; i++) {
          const p = this.particles[i];
          const x = p.nx * this.radiusX;
          const y = p.ny * this.radiusY;
          const twinkle = 0.65 + 0.35 * Math.sin(time * p.twinkleSpeed + p.twinklePhase);
          const fade = Math.pow(1 - p.dist, 1.8);
          const alpha = fade * twinkle * 0.55;

          let r, g, b;
          if (p.dist < 0.35) {
            r = 255; g = 240 + p.dist * 30; b = 200 + p.dist * 40;
          } else if (p.dist < 0.65) {
            const mix = (p.dist - 0.35) / 0.3;
            r = 255 - mix * 40;
            g = 220 - mix * 50;
            b = 220 + mix * 20;
          } else {
            const mix = (p.dist - 0.65) / 0.35;
            r = 215 - mix * 60;
            g = 170 - mix * 40;
            b = 240 - mix * 30;
          }

          ctx.beginPath();
          ctx.arc(x, y, p.size * (0.6 + fade * 0.8), 0, Math.PI * 2);
          ctx.fillStyle = "rgba(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + "," + alpha + ")";
          ctx.fill();
        }

        // 核心淡金高光
        const core = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radiusX * 0.18);
        core.addColorStop(0, "rgba(255, 248, 230, " + (0.22 * alphaPulse) + ")");
        core.addColorStop(0.5, "rgba(255, 230, 180, " + (0.08 * alphaPulse) + ")");
        core.addColorStop(1, "rgba(255, 220, 160, 0)");
        ctx.save();
        ctx.scale(1, this.radiusY / this.radiusX);
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(0, 0, this.radiusX * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
      },
    };

    // ---------- 确定性伪随机 ----------
    function createRng(seed) {
      let s = seed;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // ---------- 生成一颗绑定记录的自由漂移星 ----------
    function createStar(recordId, w, h) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 6 + Math.random() * 14; // 慢速漂移（px/s）
      return {
        recordId: recordId,
        x: STAR_MARGIN + Math.random() * (w - STAR_MARGIN * 2),
        y: STAR_MARGIN + Math.random() * (h - STAR_MARGIN * 2),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5 + Math.random() * 8,
        brightness: 0.55 + Math.random() * 0.35,
        rotation: Math.random() * Math.PI * 2,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.45 + Math.random() * 0.6,
        dirTimer: 3 + Math.random() * 6, // 距下次随机变向的秒数
      };
    }

    // ---------- 每帧更新星星位置（自由漂移） ----------
    function updateStars(dt) {
      const minX = STAR_MARGIN;
      const maxX = viewWidth - STAR_MARGIN;
      const minY = STAR_MARGIN;
      const maxY = viewHeight - STAR_MARGIN;

      allStars.forEach(function (star) {
        star.x += star.vx * dt;
        star.y += star.vy * dt;

        // 碰边折返，不让星星跑出视野
        if (star.x < minX) { star.x = minX; star.vx = Math.abs(star.vx); }
        else if (star.x > maxX) { star.x = maxX; star.vx = -Math.abs(star.vx); }
        if (star.y < minY) { star.y = minY; star.vy = Math.abs(star.vy); }
        else if (star.y > maxY) { star.y = maxY; star.vy = -Math.abs(star.vy); }

        // 每隔几秒随机改变一次方向，让运动更自然
        star.dirTimer -= dt;
        if (star.dirTimer <= 0) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 6 + Math.random() * 14;
          star.vx = Math.cos(angle) * speed;
          star.vy = Math.sin(angle) * speed;
          star.dirTimer = 3 + Math.random() * 6;
        }
      });
    }

    // ---------- 按记录数量生成星星（一对一绑定记录 id） ----------
    function buildAllStars(w, h) {

    // ---------- Canvas 尺寸设置 ----------
    function setupCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function buildBgBuffer(w, h) {
      bgBuffer = document.createElement("canvas");
      bgBuffer.width = w;
      bgBuffer.height = h;
      const ctx = bgBuffer.getContext("2d");
      const rand = createRng(42);
      const count = Math.floor((w * h) / 3500);

      for (let i = 0; i < count; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const r = rand() * 1.2 + 0.3;
        const alpha = rand() * 0.5 + 0.15;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 245, 220, " + alpha + ")";
        ctx.fill();
      }
    }

    function drawStar(ctx, cx, cy, outerR, brightness, rotation) {
      const innerR = outerR * 0.4;

      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, outerR * 2.5);
      glow.addColorStop(0, "rgba(255, 230, 150, " + (brightness * 0.35) + ")");
      glow.addColorStop(1, "rgba(255, 230, 150, 0)");
      ctx.beginPath();
      ctx.arc(cx, cy, outerR * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = rotation + (i * Math.PI) / 4;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const fill = ctx.createRadialGradient(cx, cy, 0, cx, cy, outerR);
      fill.addColorStop(0, "rgba(255, 252, 240, " + brightness + ")");
      fill.addColorStop(0.6, "rgba(255, 230, 160, " + (brightness * 0.85) + ")");
      fill.addColorStop(1, "rgba(255, 200, 100, " + (brightness * 0.4) + ")");
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function spawnMeteor() {
      const w = viewWidth;
      const h = viewHeight;
      const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.35;

      meteors.push({
        x: Math.random() * w * 1.1 - w * 0.05,
        y: Math.random() * h * 0.35 - 60,
        vx: Math.cos(angle) * (280 + Math.random() * 220),
        vy: Math.sin(angle) * (280 + Math.random() * 220),
        length: 70 + Math.random() * 90,
        opacity: 0.45 + Math.random() * 0.45,
        width: 1.2 + Math.random() * 0.8,
      });
    }

    function updateAndDrawMeteors(ctx, dt) {
      meteorCooldown -= dt;
      if (meteorCooldown <= 0) {
        spawnMeteor();
        meteorCooldown = 3 + Math.random() * 6;
      }

      const w = viewWidth;
      const h = viewHeight;
      const remaining = [];

      for (let i = 0; i < meteors.length; i++) {
        const m = meteors[i];
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        if (m.x > w + 100 || m.y > h + 100) continue;

        const speed = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
        const dirX = m.vx / speed;
        const dirY = m.vy / speed;
        const tailX = m.x - dirX * m.length;
        const tailY = m.y - dirY * m.length;

        const grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
        grad.addColorStop(0, "rgba(255, 255, 255, 0)");
        grad.addColorStop(0.6, "rgba(220, 235, 255, " + (m.opacity * 0.35) + ")");
        grad.addColorStop(1, "rgba(255, 250, 230, " + m.opacity + ")");

        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(m.x, m.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = m.width;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(m.x, m.y, m.width * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 252, 240, " + m.opacity + ")";
        ctx.fill();

        remaining.push(m);
      }

      meteors = remaining;
    }

    function drawBackground(dt) {
      bgCtx.clearRect(0, 0, viewWidth, viewHeight);

    // 处理多图选择：依次上传，收集所有公开 URL 与路径
    async function handleImageSelect() {
      const files = Array.from(addImageInput.files || []);
      if (!files.length) return;

      // 类型校验：全部必须是图片
      for (let i = 0; i < files.length; i++) {
        if (!files[i].type.startsWith("image/")) {
          imageFileNameEl.textContent = "请只选择图片文件";
          addImageInput.value = "";
          return;
        }
      }

      for (let i = 0; i < files.length; i++) {
        imageFileNameEl.textContent = "上传中…（" + (i + 1) + "/" + files.length + "）";
        const res = await uploadFile(files[i]);
        if (res) {
          // 追加而非覆盖：多次选择图片会累积
          pendingImageUrls.push(res.url);
          pendingImagePaths.push(res.path);
        }
      }

      // 清空 input，保证再次选择同一文件仍能触发 change
      addImageInput.value = "";

      if (pendingImageUrls.length) {
        imageFileNameEl.textContent = "已选择 " + pendingImageUrls.length + " 张图片";
      } else {
        imageFileNameEl.textContent = "上传失败，请重试";
      }
      renderImageThumbs();
    }

    // 点击按钮触发文件选择
    addImageBtn.addEventListener("click", function () { addImageInput.click(); });
    addImageInput.addEventListener("change", handleImageSelect);

    async function handleAddSave() {
      const text = addTextEl.value.trim();
      const yearText = addDateYearEl.value.trim();
      const monthText = addDateMonthEl.value.trim();
      const dayText = addDateDayEl.value.trim();

      // 校验：先文字、后日期（对应提示文案）
      if (!text) {
        addErrorEl.textContent = "请至少写点什么吧";
        return;
      }
      if (!yearText || !monthText || !dayText) {
        addErrorEl.textContent = "请填写日期";
        return;
      }

      // 格式与有效性校验：年 4 位、月/日 1-2 位，且构成真实日期（含闰年、大小月）
      const year = parseInt(yearText, 10);
      const month = parseInt(monthText, 10);
      const day = parseInt(dayText, 10);
      if (
        !/^\d{4}$/.test(yearText) ||
        !/^\d{1,2}$/.test(monthText) ||
        !/^\d{1,2}$/.test(dayText) ||
        !isValidDate(year, month, day)
      ) {
        addErrorEl.textContent = "请输入有效日期";
        return;
      }

      const date = year + "年" + month + "月" + day + "日";

      // 插入云端（含图片公开 URL 数组），返回带数据库 id 的完整记录
      const record = await insertMemory(date, text, pendingImageUrls);
      if (!record) {
        addErrorEl.textContent = "保存失败，请稍后再试";
        return;
      }

      memories.push(record);

      // 新增一颗绑定该记录的星星，随机位置，页面即时出现
      allStars.push(createStar(record.id, viewWidth, viewHeight));

      closeAddModal();
    }

    // 表单弹窗交互：遮罩 / 关闭 / 取消 / 保存
    addModal.addEventListener("click", function (e) {
      if (e.target === addModal) closeAddModal();
    });
    document.getElementById("add-close").addEventListener("click", closeAddModal);
    document.getElementById("add-cancel").addEventListener("click", closeAddModal);
    document.getElementById("add-save").addEventListener("click", handleAddSave);

    /* ============================================================
     * 日历模块：按日期查找回忆
     * - 容错解析日期字符串 → { year, month, day }
     * - 按年月渲染日历，暖金高亮有记录的日期
     * - 点击日期列出该日记录，点击记录打开回忆弹窗
     * ============================================================ */

    const calendarModal = document.getElementById("calendar-modal");
    const calendarTitleEl = document.getElementById("calendar-title");
    const calendarGridEl = document.getElementById("calendar-grid");
    const dateListModal = document.getElementById("date-list-modal");
    const dateListEl = document.getElementById("date-list");
    const calPrevYearBtn = document.getElementById("cal-prev-year");
    const calNextYearBtn = document.getElementById("cal-next-year");
    const calPrevBtn = document.getElementById("cal-prev");
    const calNextBtn = document.getElementById("cal-next");

    let calYear = 0;
    let calMonth = 0; // 1-12

    // 容错解析日期字符串："2025年5月21日" / "2025-05-21" / "2025/5/21 14:30" 等
    function parseDateParts(dateStr) {
      if (!dateStr) return null;
      const nums = String(dateStr).match(/\d+/g);
      if (!nums || nums.length < 3) return null;

      let year, month, day;
      // 优先把首个 4 位数字当作年份
      const yearIdx = nums.findIndex(function (n) { return n.length === 4; });
      if (yearIdx >= 0) {
        year = parseInt(nums[yearIdx], 10);
        month = parseInt(nums[yearIdx + 1], 10);
        day = parseInt(nums[yearIdx + 2], 10);
      } else {
        year = parseInt(nums[0], 10);
        month = parseInt(nums[1], 10);
        day = parseInt(nums[2], 10);
      }

      if (!year || !month || !day) return null;
      if (!isValidDate(year, month, day)) return null;
      return { year: year, month: month, day: day };
    }

    function dateKey(year, month, day) {
      return year + "-" + month + "-" + day;
    }

    // 将 memories 按日期分组：{ "2025-5-21": [record, ...] }
    function buildDateMap() {
      const map = {};
      memories.forEach(function (record) {
        const parts = parseDateParts(record.date);
        if (!parts) return;
        const key = dateKey(parts.year, parts.month, parts.day);
        if (!map[key]) map[key] = [];
        map[key].push(record);
      });
      return map;
    }

    // 点击某一天：单条直接打开回忆，多条弹选择列表
    function onDayClick(records) {
      if (!records || !records.length) return;
      if (records.length === 1) {
        openMemoryModal(records[0]);
      } else {
        openDateList(records);
      }
    }

    function openDateList(records) {
      dateListEl.innerHTML = "";
      records.forEach(function (record) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "calendar-item";
        btn.textContent = record.text || "（空白回忆）";
        btn.title = record.date || "";
        btn.addEventListener("click", function () {
          openMemoryModal(record);
        });
        dateListEl.appendChild(btn);
      });
      dateListModal.classList.add("open");
    }

    function closeDateListModal() {
      dateListModal.classList.remove("open");
    }

    function renderCalendar() {
      calendarTitleEl.textContent = calYear + "年" + calMonth + "月";

      const dateMap = buildDateMap();
      const firstDay = new Date(calYear, calMonth - 1, 1).getDay(); // 0=周日
      const daysInMonth = new Date(calYear, calMonth, 0).getDate();

      calendarGridEl.innerHTML = "";

      // 月初前置空白占位
      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement("div");
        blank.className = "calendar-day blank";
        calendarGridEl.appendChild(blank);
      }

      const today = new Date();
      const isThisMonth =
        today.getFullYear() === calYear && today.getMonth() + 1 === calMonth;

      for (let day = 1; day <= daysInMonth; day++) {
        const key = dateKey(calYear, calMonth, day);
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "calendar-day";
        cell.textContent = day;

        const records = dateMap[key];
        if (records && records.length) {
          cell.classList.add("has-memory");
          cell.addEventListener("click", function () { onDayClick(records); });
        } else {
          cell.classList.add("empty");
        }

        if (isThisMonth && today.getDate() === day) {
          cell.classList.add("today");
        }

        calendarGridEl.appendChild(cell);
      }
    }

    function openCalendar() {
      // 默认定位到最新一条记录的月份，无记录则今天
      let target = null;
      for (let i = memories.length - 1; i >= 0; i--) {
        const parts = parseDateParts(memories[i].date);
        if (parts) { target = parts; break; }
      }
      if (!target) {
        const now = new Date();
        target = { year: now.getFullYear(), month: now.getMonth() + 1 };
      }
      calYear = target.year;
      calMonth = target.month;
      renderCalendar();
      calendarModal.classList.add("open");
    }

    function closeCalendarModal() {
      calendarModal.classList.remove("open");
    }

    calPrevYearBtn.addEventListener("click", function () {
      calYear--;
      renderCalendar();
    });

    calPrevBtn.addEventListener("click", function () {
      calMonth--;
      if (calMonth < 1) { calMonth = 12; calYear--; }
      renderCalendar();
    });

    calNextBtn.addEventListener("click", function () {
      calMonth++;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      renderCalendar();
    });

    calNextYearBtn.addEventListener("click", function () {
      calYear++;
      renderCalendar();
    });

    calendarModal.addEventListener("click", function (e) {
      if (e.target === calendarModal) closeCalendarModal();
    });
    document.getElementById("calendar-close").addEventListener("click", closeCalendarModal);

    dateListModal.addEventListener("click", function (e) {
      if (e.target === dateListModal) closeDateListModal();
    });
    document.getElementById("date-list-close").addEventListener("click", closeDateListModal);

    // 统一的 Esc 处理：按层级从最上层依次关闭（图片预览 → 回忆 → 添加 → 选择列表 → 日历）
    window.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      if (imagePreviewOverlay.classList.contains("open")) { closeImagePreview(); return; }
      if (memoryModal.classList.contains("open")) { closeMemoryModal(); return; }
      if (addModal.classList.contains("open")) { closeAddModal(); return; }
      if (dateListModal.classList.contains("open")) { closeDateListModal(); return; }
      if (calendarModal.classList.contains("open")) { closeCalendarModal(); return; }
    });

    async function init() {
      bgCanvas = document.getElementById("bg-canvas");
      galaxyCanvas = document.getElementById("galaxy-canvas");
      starsCanvas = document.getElementById("stars-canvas");

      starsCanvas.addEventListener("pointerdown", handleStarClick);
      document.querySelector(".add-btn").addEventListener("click", openAddModal);
      document.querySelector(".cal-btn").addEventListener("click", openCalendar);

      // 先从云端加载记录，再按记录数生成星星
      memories = await fetchMemories();

      handleResize();

      if (animFrameId) cancelAnimationFrame(animFrameId);
      lastTimestamp = 0;
      meteors = [];
      meteorCooldown = 1.5;
      animFrameId = requestAnimationFrame(animate);
    }

    window.addEventListener("load", init);
    window.addEventListener("resize", handleResize);
  </script>
</body>
</html>
